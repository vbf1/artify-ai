name: Validate Artify AI
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build

  flutter-analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
        working-directory: mobile
      - run: flutter analyze
        working-directory: mobile

  api-health:
    runs-on: ubuntu-latest
    steps:
      - name: Check deployed API health
        env:
          API_URL: https://artify-ai-api.victorbatistafp.workers.dev
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 "$API_URL/health")"
          echo "$response"
          python -c 'import json,sys; d=json.loads(sys.argv[1]); assert d.get("status") == "ok", d; assert d.get("generationEnabled") is True, d; print("API e binding de IA ativos.")' "$response"
      - name: Check browser preflight
        env:
          API_URL: https://artify-ai-api.victorbatistafp.workers.dev
        run: |
          set -euo pipefail
          headers="$(curl --silent --show-error --dump-header - --output /dev/null --request OPTIONS "$API_URL/generate" --header 'Origin: https://vbf1.github.io' --header 'Access-Control-Request-Method: POST' --header 'Access-Control-Request-Headers: content-type')"
          echo "$headers"
          echo "$headers" | grep -qi 'access-control-allow-origin: https://vbf1.github.io'
          echo "$headers" | grep -qi 'access-control-allow-methods:.*POST'

      - name: Check API input validation without consuming AI quota
        env:
          API_URL: https://artify-ai-api.victorbatistafp.workers.dev
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --output /tmp/invalid.json --write-out '%{http_code}' --request POST "$API_URL/generate" --header 'Content-Type: application/json' --data '{"count":2,"format":"4:5","scenes":["Parque"],"image":"invalid"}')"
          cat /tmp/invalid.json
          test "$code" = "400"
          grep -q 'Quantidade deve ser 3, 6 ou 9' /tmp/invalid.json

      - name: Check malformed image rejection without consuming AI quota
        env:
          API_URL: https://artify-ai-api.victorbatistafp.workers.dev
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --output /tmp/malformed-image.json --write-out '%{http_code}' --request POST "$API_URL/generate" --header 'Content-Type: application/json' --data '{"count":3,"format":"4:5","scenes":["Parque"],"image":"data:image/png;base64,QUJD"}')"
          cat /tmp/malformed-image.json
          test "$code" = "400"
          grep -q 'Imagem inválida' /tmp/malformed-image.json

      - name: Check JSON content type enforcement without consuming AI quota
        env:
          API_URL: https://artify-ai-api.victorbatistafp.workers.dev
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --output /tmp/content-type.json --write-out '%{http_code}' --request POST "$API_URL/generate" --header 'Content-Type: text/plain' --data '{"count":3}')"
          cat /tmp/content-type.json
          test "$code" = "415"
          grep -q 'formato JSON' /tmp/content-type.json

      - name: Check untrusted origins receive no CORS permission
        env:
          API_URL: https://artify-ai-api.victorbatistafp.workers.dev
        run: |
          set -euo pipefail
          headers="$(curl --silent --show-error --dump-header - --output /dev/null --request OPTIONS "$API_URL/generate" --header 'Origin: https://example.invalid' --header 'Access-Control-Request-Method: POST')"
          echo "$headers"
          if echo "$headers" | grep -qi 'access-control-allow-origin:'; then
            echo "Unexpected CORS permission for an untrusted origin"
            exit 1
          fi
