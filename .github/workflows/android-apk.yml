name: Build Artify AI Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform files
        run: flutter create --platforms=android --org com.artifyai .
      - name: Set app display name
        run: |
          sed -i 's/android:label="artify_ai"/android:label="Artify AI"/' android/app/src/main/AndroidManifest.xml
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Build installable APK
        run: flutter build apk --release --dart-define=API_BASE_URL=https://artify-ai-api.victorbatistafp.workers.dev
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: artify-ai-android-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
